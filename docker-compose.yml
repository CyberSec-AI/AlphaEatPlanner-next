version: '3.8'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha-eat-planner
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXTAUTH_SECRET=changeme123
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - type: bind
        source: ./prisma
        target: /app/prisma
    restart: always
